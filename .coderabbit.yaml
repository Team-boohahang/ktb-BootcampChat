# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: ko-KR

reviews:
  profile: chill
  request_changes_workflow: false

  # PR 상단 설명
  high_level_summary: true
  changed_files_summary: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  assess_linked_issues: false
  related_issues: false
  related_prs: false

  # 불필요한 부가 기능 비활성화
  suggested_labels: false
  auto_apply_labels: false
  suggested_reviewers: false
  auto_assign_reviewers: false
  poem: false
  in_progress_fortune: false

  # 리뷰 대상
  path_filters:
    - "apps/frontend/**"
    - "apps/backend/**"

    - "!**/node_modules/**"
    - "!**/.next/**"
    - "!**/target/**"
    - "!**/build/**"
    - "!**/dist/**"
    - "!**/coverage/**"
    - "!**/public/**"

    - "!**/.env"
    - "!**/.env.*"
    - "!**/.vscode/**"
    - "!**/.husky/**"
    - "!**/.github/**"

    - "!**/package-lock.json"
    - "!**/yarn.lock"
    - "!**/pnpm-lock.yaml"

    - "!**/Dockerfile"

  path_instructions:
    # ==============================
    # Frontend
    # ==============================
    - path: "apps/frontend/**/*.{js,jsx}"
      instructions: |
        당신은 Next.js, React, JavaScript 기반 프론트엔드 코드 리뷰어입니다.

        이 프로젝트의 핵심 목표는 UI 완성도가 아니라
        Playwright + Artillery 기반 e2e 부하 테스트에서
        안정적으로 동작하는 채팅 클라이언트를 만드는 것입니다.

        리뷰에서는 다음 항목을 우선적으로 확인해주세요.

        - 불필요한 React 리렌더링
        - 메시지 목록 전체 정렬/필터링/렌더링
        - 과도한 DOM 및 스크롤 계산
        - Socket.IO 연결/재연결 안정성
        - Socket.IO 이벤트 중복 처리
        - timeout 및 에러 처리
        - 이벤트 listener / timer / observer cleanup
        - 대용량 메시지에서 브라우저 성능 저하
        - e2e 테스트용 data-testid 파손 여부

        특히 다음 data-testid는 변경 또는 삭제되지 않았는지 확인해주세요.

        - chat-message-input
        - chat-send-button
        - join-chat-room-button
        - file-upload-input
        - message-content
        - file-message-container
        - toast-error

        모든 리뷰 코멘트는 반드시 아래 형식으로 시작해주세요.

        P1: 즉시 수정이 필요한 장애/데이터 유실/테스트 실패 수준
        P2: 성능 또는 안정성 개선 효과가 큰 문제
        P3: 현재도 동작하지만 더 나은 구현 방향
        P4: 네이밍, 스타일 등 사소한 의견

        UI 디자인이나 미관 개선은 부하 테스트와 직접 관련이 없다면
        리뷰하지 마세요.

        과도한 추상화보다 현재 구조를 유지하는 단순한 해결책을 우선해주세요.

    - path: "apps/frontend/features/chat/**/*.{js,jsx}"
      instructions: |
        채팅 핵심 로직입니다.

        다음 항목을 특히 확인해주세요.

        - Socket.IO joinRoom / leaveRoom / reconnect
        - 동일 이벤트 listener 중복 등록
        - 메시지 중복 수신
        - 이전 메시지 중복 요청
        - timeout 없이 Promise가 오래 대기하는 문제
        - 재연결 후 joinRoom 중복 실행
        - 파일 업로드 실패 후 상태 복구
        - 메시지 증가에 따른 전체 DOM 렌더링

        요청과 응답을 동일한 공용 Socket.IO 이벤트로 처리해서
        여러 Promise가 같은 응답으로 완료될 가능성이 있다면
        requestId 또는 Socket.IO ack callback 사용을 P1 또는 P2로 제안해주세요.

    - path: "apps/frontend/lib/socket/**/*.{js,jsx}"
      instructions: |
        Socket.IO 클라이언트 안정성을 집중적으로 리뷰해주세요.

        다음 문제를 우선적으로 찾으세요.

        - 불필요한 socket 생성
        - forceNew 남용
        - connect/disconnect 반복
        - listener cleanup 누락
        - timeout 미설정
        - success 이벤트와 broadcast 이벤트 혼용
        - 동일 응답이 여러 요청 Promise를 완료시키는 문제

        동시 메시지 전송에서 응답을 구분할 수 없다면
        requestId 또는 ack callback 도입을 P1 또는 P2로 지적해주세요.

    # ==============================
    # Backend
    # ==============================
    - path: "apps/backend/**"
      instructions: |
        당신은 Spring Boot 기반 실시간 채팅 백엔드 리뷰어입니다.

        이 프로젝트는 짧은 기간 동안 진행하는 부하테스트 프로젝트이므로
        복잡한 아키텍처 변경보다 즉시 효과가 있는 성능 및 안정성 개선을
        우선해주세요.

        특히 다음 항목을 확인해주세요.

        1. MongoDB
        - 메시지마다 불필요한 조회/저장이 발생하는지
        - findById 후 save 반복
        - N+1 조회
        - pagination 부재
        - room + timestamp 인덱스 필요 여부
        - 같은 문서에 동시 write가 집중되는 구조

        2. Socket.IO
        - 연결/재연결 처리
        - joinRoom / leaveRoom / disconnect
        - 이벤트 listener 중복
        - 단일 서버 메모리 상태 의존
        - 여러 인스턴스에서 메시지 전달 누락 가능성

        3. Redis
        - Rate Limit
        - Socket 접속 상태
        - 임시 세션
        - TTL이 필요한 상태

        이런 임시 상태가 MongoDB에 저장되고 있다면
        Redis 사용을 검토해주세요.

        4. 부하 테스트
        - latency 증가 가능성이 있는 동기 처리
        - 공유 상태의 동시성 문제
        - 예외를 로그만 남기고 무시하는 코드
        - 과도한 DB 호출
        - Socket 메시지 유실 가능성

        모든 리뷰 코멘트는 반드시 다음 중 하나로 시작해주세요.

        P1: 장애, 데이터 유실, 메시지 누락, 심각한 병목
        P2: 성능 또는 안정성 개선 효과가 큰 문제
        P3: 개선 가능한 대안
        P4: 네이밍 또는 사소한 스타일

        문제의 원인 → 부하 상황에서의 영향 → 개선 방법 순으로
        간결하게 작성해주세요.

        지나친 추상화나 대규모 구조 변경은 제안하지 마세요.

  auto_review:
    enabled: true

    # PR 생성 시 전체 리뷰 후 동일 PR에 push된 변경분을 재리뷰
    auto_incremental_review: true

    # 반복 push 중 자동 리뷰가 일시정지되지 않도록 설정
    auto_pause_after_reviewed_commits: 0

    drafts: false

chat:
  auto_reply: true

knowledge_base:
  web_search:
    enabled: false

  code_guidelines:
    enabled: true
    filePatterns:
      - "README.md"
      - "apps/frontend/README.md"
      - "apps/frontend/package.json"
      - "e2e/README.md"
      - "e2e/artillery/README.md"
      - "apps/backend/README.md"
      - "apps/backend/pom.xml"

  learnings:
    scope: local

  issues:
    scope: local

  pull_requests:
    scope: local
