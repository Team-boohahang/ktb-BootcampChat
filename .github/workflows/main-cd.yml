name: Main CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
      NEXT_PUBLIC_SOCKET_URL: ${{ vars.NEXT_PUBLIC_SOCKET_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate frontend configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NEXT_PUBLIC_API_URL" || { echo "NEXT_PUBLIC_API_URL repository variable is required" >&2; exit 1; }
          test -n "$NEXT_PUBLIC_SOCKET_URL" || { echo "NEXT_PUBLIC_SOCKET_URL repository variable is required" >&2; exit 1; }

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        run: pnpm --dir apps/frontend lint

      - name: Test frontend
        run: pnpm --dir apps/frontend test

      - name: Build frontend
        run: pnpm --dir apps/frontend build

      - name: Package frontend artifact
        shell: bash
        run: |
          set -euo pipefail
          tar -C apps/frontend -czf frontend-release.tar.gz \
            .next/standalone \
            .next/static \
            public \
            restart.sh

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-release-${{ github.sha }}
          path: frontend-release.tar.gz
          if-no-files-found: error
          retention-days: 7

  backend-build:
    name: Backend Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
          cache-dependency-path: apps/backend/pom.xml

      - name: Test and package backend
        working-directory: apps/backend
        run: ./mvnw --batch-mode --no-transfer-progress clean package

      - name: Upload backend test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports-${{ github.run_id }}
          path: apps/backend/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stage backend artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backend-release/target
          cp apps/backend/target/ktb-chat-backend-0.0.1-SNAPSHOT.jar backend-release/target/
          cp apps/backend/app-control.sh backend-release/

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-release-${{ github.sha }}
          path: backend-release/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy Production
    needs:
      - frontend-build
      - backend-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SSH_USER: ${{ vars.SSH_USER }}
      BACKEND_HOSTS: ${{ vars.BACKEND_HOSTS }}
      FRONTEND_HOSTS: ${{ vars.FRONTEND_HOSTS }}
      BACKEND_DEPLOY_PATH: ${{ vars.BACKEND_DEPLOY_PATH }}
      FRONTEND_DEPLOY_PATH: ${{ vars.FRONTEND_DEPLOY_PATH }}

    steps:
      - name: Validate deployment configuration
        shell: bash
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_USER" || { echo "SSH_USER repository variable is required" >&2; exit 1; }
          test -n "$BACKEND_HOSTS" || { echo "BACKEND_HOSTS repository variable is required" >&2; exit 1; }
          test -n "$FRONTEND_HOSTS" || { echo "FRONTEND_HOSTS repository variable is required" >&2; exit 1; }
          test -n "$BACKEND_DEPLOY_PATH" || { echo "BACKEND_DEPLOY_PATH repository variable is required" >&2; exit 1; }
          test -n "$FRONTEND_DEPLOY_PATH" || { echo "FRONTEND_DEPLOY_PATH repository variable is required" >&2; exit 1; }
          test -n "$DEPLOY_SSH_PRIVATE_KEY" || { echo "DEPLOY_SSH_PRIVATE_KEY secret is required" >&2; exit 1; }
          test -n "$SSH_KNOWN_HOSTS" || { echo "SSH_KNOWN_HOSTS secret is required" >&2; exit 1; }

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-release-${{ github.sha }}
          path: artifacts/frontend

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-release-${{ github.sha }}
          path: artifacts/backend

      - name: Prepare deployment files and SSH
        shell: bash
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p release/frontend "$HOME/.ssh"
          tar -C release/frontend -xzf artifacts/frontend/frontend-release.tar.gz
          install -m 600 /dev/null "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy backend
        shell: bash
        run: |
          set -euo pipefail
          for host in $BACKEND_HOSTS; do
            destination="$SSH_USER@$host"
            ssh -o BatchMode=yes "$destination" "mkdir -p '$BACKEND_DEPLOY_PATH/target' '$BACKEND_DEPLOY_PATH/logs'"
            rsync -az artifacts/backend/target/ktb-chat-backend-0.0.1-SNAPSHOT.jar \
              "$destination:$BACKEND_DEPLOY_PATH/target/"
            rsync -az artifacts/backend/app-control.sh \
              "$destination:$BACKEND_DEPLOY_PATH/"
            ssh -o BatchMode=yes "$destination" \
              "cd '$BACKEND_DEPLOY_PATH' && chmod +x app-control.sh && ./app-control.sh restart"
          done

      - name: Deploy frontend
        shell: bash
        run: |
          set -euo pipefail
          for host in $FRONTEND_HOSTS; do
            destination="$SSH_USER@$host"
            ssh -o BatchMode=yes "$destination" \
              "mkdir -p '$FRONTEND_DEPLOY_PATH/apps/frontend/.next' '$FRONTEND_DEPLOY_PATH/apps/frontend'"
            rsync -az --delete \
              --exclude='.env*' \
              --exclude='*.log' \
              --exclude='restart.sh' \
              release/frontend/.next/standalone/ \
              "$destination:$FRONTEND_DEPLOY_PATH/"
            rsync -az --delete release/frontend/.next/static \
              "$destination:$FRONTEND_DEPLOY_PATH/apps/frontend/.next/"
            rsync -az --delete release/frontend/public \
              "$destination:$FRONTEND_DEPLOY_PATH/apps/frontend/"
            rsync -az release/frontend/restart.sh \
              "$destination:$FRONTEND_DEPLOY_PATH/"
            ssh -o BatchMode=yes "$destination" \
              "cd '$FRONTEND_DEPLOY_PATH' && chmod +x restart.sh && ./restart.sh"
          done
